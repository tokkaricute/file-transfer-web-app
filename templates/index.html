<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Transfer Web App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>File Transfer Web App</h1>
            <div id="path-display">Current Path: <span id="current-path">.</span></div>>
        </header>

        <div id="auth-section" class="hidden">
            <div class="card">
                <h3>Authentication Required</h3>
                <input type="password" id="password-input" placeholder="Enter Password">
                <button id="login-button">Login</button>
                <p id="auth-error" class="error hidden">Invalid password</p>
            </div>>
        </div>>

        <div id="main-content" class="hidden">
            <section id="file-browser">
                <div class="toolbar">
                    <button id="back-button">Go Up</button>
                </div>>
                <div id="file-list-container">
                    <ul id="file-list">
                        <!-- Files will be listed here -->
                    </ul>
                </div>>

                <div id="selection-controls">
                    <button id="download-button" disabled>Download Selected</button>
                </div>>

                <div id="upload-section">
                    <div class="card">
                        <h3>Upload Files</h3>
                        <input type="file" id="file-input" multiple>
                        <button id="upload-button">Upload</button>
                        <div id="progress-container" class="hidden">
                            <div id="progress-bar"></div>>
                        </div>>
                        <p id="upload-status"></p>
                    </div>>
                </div>>
            </section>
        </div>>
    </div>>
    <script src="/static/js/app.js"></script>
</body>
</html>

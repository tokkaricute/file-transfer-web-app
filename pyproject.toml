[project]
name = "cline-file-transfer-web-app"
version = "0.1.0"
description = "A lightweight file transfer web app using FastAPI and uv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[project.scripts]
cline-file-transfer-web-app = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
